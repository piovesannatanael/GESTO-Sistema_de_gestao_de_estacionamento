{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div id="dados">
    <div class="card shadow m-3 col-md-6 mx-auto">
        <div class="card-body">
            <h3 class="text-center mb-3">Confirmar Exclusão</h3>

            <div class="alert alert-danger">
                <p>Você tem certeza que deseja apagar a estada do veículo <strong>{{ object.veiculo.placa }}</strong>?</p>
                <p class="mb-0">Esta ação não pode ser desfeita.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-danger">Sim, apagar</button>
                    <a href="{% url 'estadias' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
