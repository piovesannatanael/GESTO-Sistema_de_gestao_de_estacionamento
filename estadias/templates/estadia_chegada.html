{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div id="dados">
    <div class="card shadow m-3 col-md-6 mx-auto">
        <div class="card-body">
            <div class="container">
                <h3 class="mt-4 mb-4">Registrar Chegada de Veículo</h3>
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form_errors form %}
                    {% bootstrap_form form %}
                    <button type="submit" class="btn btn-primary">Registrar Entrada</button>
                    <a href="{% url 'estadias' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
