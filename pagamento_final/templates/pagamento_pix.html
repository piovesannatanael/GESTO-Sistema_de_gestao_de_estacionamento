{% extends 'principal.html' %}
{% block content %}
<div class="container text-center mt-5">
    <h4>Pagamento via PIX</h4>
    <p>Valor a pagar: <strong>R$ {{ estadia.valor_total|floatformat:2 }}</strong></p>

    <img src="..." alt="QR Code PIX" width="300">

    <p class="mt-3">Após realizar o pagamento, confirme abaixo para finalizar.</p>

    <form action="{% url 'pagamento_final:pagamento_concluido' estadia.pk %}" method="post">
        {% csrf_token %}
        <a href="{% url 'estadias' %}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Confirmar Pagamento</button>
    </form>
</div>
{% endblock %}
