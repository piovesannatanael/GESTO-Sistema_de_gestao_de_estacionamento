{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container">
    <div class="card shadow m-3 col-md-6 mx-auto">
        <div class="card-body">
            <h3 class="text-center">Confirmar Exclusão</h3>
            <p class="mt-3">Você tem certeza que deseja excluir a vaga <strong>{{ object.codigo }}</strong>?</p>
            <p class="text-danger">Esta ação não pode ser desfeita.</p>
            <form method="post">
                {% csrf_token %}
                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-danger">Sim, excluir</button>
                    <a href="{% url 'vagas' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
