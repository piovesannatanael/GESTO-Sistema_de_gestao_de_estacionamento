{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container">
    <h3 class="mt-4 mb-4">Confirmar Exclusão</h3>
    <form method="post">
        {% csrf_token %}
        <div class="alert alert-danger">
            <p>Você tem certeza que deseja apagar o cliente: <strong>{{ object }}</strong>?</p>
            <p>Esta ação não pode ser desfeita.</p>
        </div>
        
        <button type="submit" class="btn btn-danger">Sim, apagar</button>
        <a href="{% url 'cliente_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
