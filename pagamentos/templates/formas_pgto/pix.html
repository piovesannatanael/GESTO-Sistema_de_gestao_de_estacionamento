{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Pagamento via PIX</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <h5>Resumo do Pagamento</h5>
                        <p><strong>Valor Total:</strong> R$ {{ pagamento.valor_total }}</p>
                    </div>

                    <div class="bg-light p-4 mb-4">
                        <p class="mb-2"><strong>Chave PIX:</strong> pix@gesto.com</p>
                        <p class="mb-3">Ou escaneie o QR Code abaixo:</p>
                        <div class="bg-white p-3 d-inline-block">
                            <div style="width: 200px; height: 200px; background: #f8f9fa; display: flex; align-items: center; justify-content: center;">
                                QR CODE AQUI
                            </div>
                        </div>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'pagamentos:processar_pagamento' estadia.pk %}" class="btn btn-secondary me-md-2">Voltar</a>
                            <button type="submit" class="btn btn-success">Pagamento Confirmado</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
