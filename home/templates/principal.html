<!doctype html>
{% load static %}
{% load django_bootstrap5 %}
<html lang="pt-br">
<head>
  {% block head %}
    {% include "head.html" %}
  {% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🚗 EasyPark</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="{% url 'index' %}">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'clientes' %}">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'funcionarios' %}">Funcionários</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'veiculos' %}">Veículos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Estadas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-4">
    {% block content %}

    {% endblock %}
  </main>

  <footer class="text-center py-3">
    &copy; EasyPark
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
