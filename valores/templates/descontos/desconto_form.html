{% extends 'principal.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div id="dados">
    <div class="card shadow m-3 col-md-6 mx-auto">
        <div class="card-body">
            <div class="container py-3">
                <h3 class="mt-3 mb-4 text-center">
                    {% if object.pk %}
                        EDITAR REGRA DE DESCONTO
                    {% else %}
                        ADICIONAR REGRA DE DESCONTO
                    {% endif %}
                </h3>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <a href="{% url 'descontos' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
